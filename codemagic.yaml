workflows:
  umi-ios:
    name: UMI - App Store
    instance_type: mac_mini_m2
    max_build_duration: 60

    integrations:
      app_store_connect: UMI Codemagic

    environment:
      node: 24
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.askiasalembere.umi

    scripts:
      - name: Installer les dependances
        script: npm ci

      - name: Compiler React
        script: npm run build

      - name: Synchroniser iOS
        script: npx cap sync ios

      - name: Configurer la signature
        script: xcode-project use-profiles

      - name: Definir le numero de build
        script: |
          set -e
          cd ios/App
          agvtool new-version -all "$BUILD_NUMBER"

      - name: Compiler UMI pour Apple
        script: |
          set -e
          xcode-project build-ipa \
            --project ios/App/App.xcodeproj \
            --scheme App

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false

  umi-captures:
    name: UMI - Captures automatiques
    instance_type: mac_mini_m2
    max_build_duration: 30

    environment:
      node: 24
      java: 17
      xcode: latest

    scripts:
      - name: Installer les dependances
        script: npm ci

      - name: Compiler React
        script: npm run build

      - name: Synchroniser iOS
        script: npx cap sync ios

      - name: Compiler pour le simulateur
        script: |
          set -e
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/simulator \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Installer Maestro
        script: |
          set -e
          curl -fsSL https://get.maestro.mobile.dev \
            -o /tmp/install-maestro.sh
          bash /tmp/install-maestro.sh

      - name: Capturer iPhone et iPad
        script: |
          set -e
          export MAESTRO_CLI_NO_ANALYTICS=1
          mkdir -p captures

          cat > /tmp/umi-navigation.yaml <<'FLOW'
          appId: com.askiasalembere.umi
          ---
          - tapOn:
              text: "Don.t Allow|Ne pas autoriser"
              optional: true
          - tapOn:
              text: "Allow|Autoriser"
              optional: true
          - tapOn: "Passer"
          - extendedWaitUntil:
              visible: "Machines populaires"
              timeout: 60000
          - waitForAnimationToEnd:
              timeout: 10000
          FLOW

          xcrun simctl list devices available --json \
            > /tmp/umi-devices.json

          python3 - <<'PY' > /tmp/umi-devices.tsv
          import json

          with open("/tmp/umi-devices.json") as f:
              data = json.load(f)

          groups = [
              ("iphone", ["iPhone 17 Pro", "iPhone 17"]),
              ("ipad", ["iPad Pro 13-inch (M5)", "iPad Pro 13-inch (M4)"]),
          ]

          devices = [
              device
              for runtime, items in data["devices"].items()
              if "iOS" in runtime
              for device in items
              if device.get("isAvailable")
          ]

          for label, names in groups:
              chosen = next(
                  (
                      device
                      for name in names
                      for device in devices
                      if device["name"] == name
                  ),
                  None,
              )

              if chosen is None:
                  raise SystemExit(
                      "Simulateur introuvable : " + label
                  )

              print(label + "\t" + chosen["udid"])
          PY

          while IFS=$'\t' read -r label device; do
            xcrun simctl bootstatus "$device" -b

            sleep 30

            xcrun simctl install "$device" \
              build/simulator/Build/Products/Debug-iphonesimulator/App.app

            xcrun simctl launch \
              --stdout="$CM_BUILD_DIR/captures/$label-sortie.log" \
              --stderr="$CM_BUILD_DIR/captures/$label-erreurs.log" \
              "$device" com.askiasalembere.umi

            if "$HOME/.maestro/bin/maestro" \
              --device "$device" test \
              /tmp/umi-navigation.yaml \
              > "$CM_BUILD_DIR/captures/$label-navigation.log" 2>&1; then

              xcrun simctl io "$device" screenshot \
                "$CM_BUILD_DIR/captures/$label-accueil.png"
            else
              xcrun simctl io "$device" screenshot \
                "$CM_BUILD_DIR/captures/$label-echec.png"

              cat "$CM_BUILD_DIR/captures/$label-navigation.log"
              xcrun simctl shutdown "$device"
              exit 1
            fi

            xcrun simctl shutdown "$device"
          done < /tmp/umi-devices.tsv

    artifacts:
      - captures/*.png
      - captures/*.log