workflows:
  umi-ios:
    name: UMI - App Store
    instance_type: mac_mini_m2
    max_build_duration: 60

    integrations:
      app_store_connect: UMI Codemagic

    environment:
      node: 24
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.askiasalembere.umi

    scripts:
      - name: Installer les dependances
        script: npm ci

      - name: Compiler React
        script: npm run build

      - name: Synchroniser iOS
        script: npx cap sync ios

      - name: Configurer la signature
        script: xcode-project use-profiles

      - name: Definir le numero de build
        script: |
          cd ios/App
          agvtool new-version -all "$BUILD_NUMBER"

      - name: Compiler UMI pour Apple
        script: |
          xcode-project build-ipa \
            --project ios/App/App.xcodeproj \
            --scheme App

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
                submit_to_app_store: false

  umi-captures:
    name: UMI - Captures iPhone et iPad
    instance_type: mac_mini_m2
    max_build_duration: 30

    environment:
      node: 24
      xcode: latest

    scripts:
      - name: Installer les dependances
        script: npm ci

      - name: Compiler React
        script: npm run build

      - name: Synchroniser iOS
        script: npx cap sync ios

      - name: Compiler pour le simulateur
        script: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/simulator \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Preparer le fichier du simulateur
        script: |
          cd build/simulator/Build/Products/Debug-iphonesimulator
          zip -r "$CM_BUILD_DIR/UMI-simulateur.zip" App.app

    artifacts:
      - UMI-simulateur.zip
