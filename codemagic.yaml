workflows:
  umi-ios:
    name: UMI - App Store
    instance_type: mac_mini_m2
    max_build_duration: 60

    integrations:
      app_store_connect: UMI Codemagic

    environment:
      node: 24
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.askiasalembere.umi

    scripts:
      - name: Installer les dependances
        script: npm ci

      - name: Compiler React
        script: npm run build

      - name: Synchroniser iOS
        script: npx cap sync ios

      - name: Configurer la signature
        script: xcode-project use-profiles

      - name: Definir le numero de build
        script: |
          set -e
          cd ios/App
          agvtool new-version -all "$BUILD_NUMBER"

      - name: Compiler UMI pour Apple
        script: |
          set -e
          xcode-project build-ipa \
            --project ios/App/App.xcodeproj \
            --scheme App

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false

  umi-captures:
    name: UMI - Captures automatiques
    instance_type: mac_mini_m2
    max_build_duration: 30

    environment:
      node: 24
      xcode: latest

    scripts:
      - name: Installer les dependances
        script: npm ci

      - name: Compiler React
        script: npm run build

      - name: Synchroniser iOS
        script: npx cap sync ios

      - name: Compiler pour le simulateur
        script: |
          set -e
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/simulator \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Capturer iPhone et iPad
        script: |
          set -e
          mkdir -p captures
          xcrun simctl list devices available --json > /tmp/umi-devices.json

          python3 - <<'PY' > /tmp/umi-devices.tsv
          import json

          with open("/tmp/umi-devices.json") as f:
              data = json.load(f)

          groups = [
              ("iphone", ["iPhone 17 Pro", "iPhone 17"]),
              ("ipad", ["iPad Pro 13-inch (M5)", "iPad Pro 13-inch (M4)"]),
          ]

          devices = [
              device
              for runtime, items in data["devices"].items()
              if "iOS" in runtime
              for device in items
              if device.get("isAvailable")
          ]

          for label, names in groups:
              chosen = next(
                  (d for name in names for d in devices if d["name"] == name),
                  None,
              )
              if chosen is None:
                  raise SystemExit("Simulateur introuvable : " + label)
              print(label + "\t" + chosen["udid"])
          PY

          while IFS=$'\t' read -r label device; do
            xcrun simctl bootstatus "$device" -b

            xcrun simctl install "$device" \
              build/simulator/Build/Products/Debug-iphonesimulator/App.app

            xcrun simctl launch \
              --stdout="$CM_BUILD_DIR/captures/$label-sortie.log" \
              --stderr="$CM_BUILD_DIR/captures/$label-erreurs.log" \
              "$device" com.askiasalembere.umi

            sleep 20

            xcrun simctl io "$device" screenshot \
              "$CM_BUILD_DIR/captures/$label.png"

            xcrun simctl shutdown "$device"
          done < /tmp/umi-devices.tsv

    artifacts:
      - captures/*.png
      - captures/*.log